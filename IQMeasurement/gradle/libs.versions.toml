[versions]
agp = "8.5.2"
coilCompose = "2.4.0"
datastore = "1.1.3"
datastoreCore = "1.0.0"
datastoreProtobuf = "1.0.0"
gson = "2.10"
kotlin = "1.9.0"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
